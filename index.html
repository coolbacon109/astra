<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>astrainside</title>
  <meta name="theme-color" content="#ffffff" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* clean white, one card, straight into astra */
    :root {
      --bg: #ffffff;
      --text: #23262d;
      --muted: #6d7280;
      --bright: #0c0d10;
      --border: rgba(16, 18, 24, 0.1);
      --border-strong: rgba(16, 18, 24, 0.26);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 20px;
      overflow-x: hidden;
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background:
        radial-gradient(900px 480px at 50% -10%, rgba(16, 18, 24, 0.05), transparent 60%),
        var(--bg);
    }

    ::selection { background: rgba(16, 18, 24, 0.14); }

    .wordmark {
      font-family: 'Alex Brush', cursive;
      font-size: clamp(58px, 11vw, 104px);
      line-height: 1.05;
      background: linear-gradient(20deg, #4a4d55 8%, #0c0d10 55%, #575b64 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: rise 0.7s cubic-bezier(0.2, 0, 0, 1) both;
    }

    .tagline {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
      animation: rise 0.7s 0.08s cubic-bezier(0.2, 0, 0, 1) both;
    }

    .pick {
      display: flex;
      width: 100%;
      max-width: 460px;
      margin-top: 36px;
      animation: rise 0.7s 0.16s cubic-bezier(0.2, 0, 0, 1) both;
    }

    .card {
      position: relative;
      width: 100%;
      padding: 32px 28px 26px;
      text-align: center;
      border-radius: 22px;
      border: 1px solid var(--border);
      background: #fff;
      box-shadow: 0 18px 50px rgba(16, 18, 24, 0.08);
      transition: transform 0.2s cubic-bezier(0.2, 0, 0, 1), border-color 0.2s;
    }

    .card:hover {
      transform: translateY(-3px);
      border-color: var(--border-strong);
    }

    .card h2 {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.2px;
      color: var(--bright);
    }

    .card p {
      margin: 8px 0 18px;
      font-size: 13px;
      line-height: 1.5;
      color: var(--muted);
    }

    .pill {
      padding: 3px 9px;
      border: 1px solid var(--border-strong);
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 0.6px;
      color: var(--muted);
    }

    .btn {
      display: block;
      width: 100%;
      padding: 13px;
      border-radius: 12px;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 800;
      text-decoration: none;
      color: #fff;
      background: #101216;
      box-shadow: 0 4px 16px rgba(16, 18, 24, 0.22);
      transition: transform 0.15s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.15s;
    }

    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 7px 22px rgba(16, 18, 24, 0.3);
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-top: 16px;
    }

    .chips a {
      padding: 7px 14px;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s, transform 0.15s;
    }

    .chips a:hover {
      border-color: var(--border-strong);
      color: var(--bright);
      transform: translateY(-1px);
    }

    .foot {
      margin-top: 34px;
      font-size: 12px;
      color: var(--muted);
      animation: rise 0.7s 0.24s cubic-bezier(0.2, 0, 0, 1) both;
    }

    .foot a { color: var(--muted); text-decoration: none; }
    .foot a:hover { color: var(--bright); text-decoration: underline; }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
    }

    @media (max-width: 720px) {
      .pick { max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="wordmark">astrainside</div>
  <div class="tagline">( Load into astra? )</div>

  <div class="pick">
    <div class="card">
      <h2>Astra <span class="pill">( v2 )</span></h2>
      <p>browser, games, chat, roblox and more. sign in once and it all loads in one place.</p>
      <a class="btn" href="/h">Open astra</a>
      <div class="chips">
        <a href="/ai">ai</a>
        <a href="/b">browse</a>
        <a href="/g">games</a>
        <a href="/chat">chat</a>
        <a href="/a">anime</a>
        <a href="/roblox">roblox</a>
        <a href="/m">movies</a>
        <a href="/music">music</a>
      </div>
    </div>
  </div>

  <div class="foot">astrainside.space &middot; <a href="/clever">clever</a></div>
</body>
</html>
